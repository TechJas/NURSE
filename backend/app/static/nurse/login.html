<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MediLogistics Nurse Portal</title>
    <link rel="stylesheet" href="/static/admin/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #F9FAFB;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background: #4F46E5;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            margin-top: 24px;
            font-size: 16px;
        }
        .register-link {
            text-align: center;
            margin-top: 24px;
            color: var(--color-text-secondary);
            font-size: 14px;
        }
        .register-link a {
            color: #4F46E5;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="header">
            <div class="logo-box">
                <svg width="24" height="24" viewBox="0 0 32 32" fill="none">
                    <path d="M16 8L22 14L16 20L10 14L16 8Z" fill="white" />
                </svg>
            </div>
            <h1 class="page-title">Nurse Login</h1>
            <p class="page-subtitle">Access your dashboard</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" placeholder="nurse@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-login">Login</button>
        </form>

        <div class="register-link">
            Don't have an account? <a href="/">Register now</a>
        </div>
    </div>

    <div class="toast" id="toast">
        <div class="toast-content">
            <span id="toastMessage"></span>
        </div>
    </div>

    <script src="/static/nurse/app.js"></script>
</body>
</html>
